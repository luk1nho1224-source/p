<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Lucas Hernández González">
    <meta name="description" content="Formulario de inscripción para un Club Deportivo">
    <meta name="keywords" content="formulario, inscripción, club deportivo, HTML5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Club Deportivo</title>
</head>
<body>

    <header>
        <h2 style="text-align: center;">Lucas Hernández González</h2>
    </header>

    <form action="recorrer.php" method="post">

        <p style="text-align: center;">
            <img src="ASIRGYM.png" alt="Logo del club deportivo" width="100">
        </p>

        <h3>Formulario de inscripción Club Deportivo</h3>

        <fieldset>
            <legend>Datos personales</legend>

            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="lucasdni" maxlength="9" size="9" pattern="[0-9]{8}[A-Za-z]" title="8 números y una letra" required><br>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="lucasnombre" maxlength="20" required><br>

            <label for="apellido1">Primer apellido:</label>
            <input type="text" id="apellido1" name="lucasapellido1" maxlength="20" required><br>

            <label for="apellido2">Segundo apellido:</label>
            <input type="text" id="apellido2" name="lucasapellido2" maxlength="20"><br>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="lucasdireccion" maxlength="80"><br>

            <label for="cp">Código Postal:</label>
            <input type="text" id="cp" name="lucascp" maxlength="5" size="5" pattern="[0-9]{5}" title="5 números"><br>

            <label for="poblacion">Población:</label>
            <input type="text" id="poblacion" name="lucaspoblacion" maxlength="64"><br>

            <label for="provincia">Provincia:</label>
            <select id="provincia" name="lucasprovincia">
                <option value="Santa Cruz de Tenerife" selected>Santa Cruz de Tenerife</option>
                <option value="Las Palmas">Las Palmas</option>
                <option value="Madrid">Madrid</option>
                <option value="Valencia">Valencia</option>
            </select><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="lucastelefono" maxlength="9" size="9" pattern="[0-9]{9}" title="9 números"><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="lucasemail" maxlength="64"><br>

            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="lucasusuario" maxlength="9"><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="lucaspassword" maxlength="9"><br>

            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="lucasfecha"><br>

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="lucassexo">
                <option value="MUJER">Mujer</option>
                <option value="HOMBRE">Hombre</option>
                <option value="OTRO">Otro</option>
            </select><br>

            <label for="archivo">Foto o DNI escaneado (PDF/JPG):</label>
            <input type="file" id="archivo" name="lucasarchivo" accept=".pdf, .jpg, .jpeg, application/pdf, image/jpeg">
        </fieldset>

        <fieldset>
            <legend>Deportes y experiencia</legend>

            <label for="deporte">Deporte favorito:</label>
            <select id="deporte" name="lucasdeporte">
                <option value="FUTBOL">Fútbol</option>
                <option value="TENIS">Tenis</option>
                <option value="NATACION">Natación</option>
                <option value="CICLISMO">Ciclismo</option>
            </select><br>

            Experiencia previa en clubes:
            <input type="radio" id="expsi" name="lucasexperiencia" value="SI">
            <label for="expsi">Sí</label>
            <input type="radio" id="expno" name="lucasexperiencia" value="NO">
            <label for="expno">No</label><br>

            <label for="clubanterior">Nombre del club anterior:</label>
            <input type="text" id="clubanterior" name="lucasclubanterior" maxlength="32"><br>

            <label for="categoria">Categoría solicitada:</label>
            <select id="categoria" name="lucascategoria">
                <option value="INFANTIL">Infantil</option>
                <option value="JUVENIL">Juvenil</option>
                <option value="SENIOR">Senior</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Idiomas y otros datos</legend>

            <label for="idiomas">Idiomas:</label>
            <select id="idiomas" name="lucasidiomas[]" multiple size="4">
                <option value="ESPAÑOL">Español</option>
                <option value="INGLÉS">Inglés</option>
                <option value="FRANCÉS">Francés</option>
                <option value="OTROS">Otros</option>
            </select><br><br>

            <label for="otrosidiomas">Si marcó "Otros", especifique:</label>
            <textarea id="otrosidiomas" name="lucasotrosidiomas" rows="2" cols="30"></textarea><br><br>

            <label for="otrosdatos">Otros datos relevantes:</label>
            <textarea id="otrosdatos" name="lucasotrosdatos" rows="3" cols="30"></textarea>
        </fieldset>

        <br>
        <input type="submit" value="Enviar solicitud">
        <input type="reset" value="Limpiar formulario">

    </form>

</body>
</html>
